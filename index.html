<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eureka Club Sales Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .filters {
            background: #f8f9fa;
            padding: 20px 30px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-weight: 600;
            color: #495057;
            font-size: 0.9rem;
        }

        .filter-group select, .filter-group input {
            padding: 10px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 0.9rem;
            background: white;
            transition: border-color 0.3s ease;
        }

        .filter-group select:focus, .filter-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .export-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-left: auto;
        }

        .export-btn:hover {
            background: #218838;
        }

        .dashboard {
            padding: 30px;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        .metric-value {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .metric-label {
            font-size: 1rem;
            opacity: 0.9;
        }

        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border: 1px solid #e9ecef;
        }

        .chart-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }

        .chart-wrapper {
            position: relative;
            height: 400px;
        }

        .top-products {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border: 1px solid #e9ecef;
        }

        .products-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: linear-gradient(90deg, #f8f9fa 0%, #ffffff 100%);
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .product-name {
            font-weight: 600;
            color: #2c3e50;
        }

        .product-revenue {
            font-weight: 700;
            color: #667eea;
            font-size: 1.1rem;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #6c757d;
            font-size: 1.1rem;
        }

        .error {
            text-align: center;
            padding: 60px;
            color: #dc3545;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .charts {
                grid-template-columns: 1fr;
            }
            
            .filters {
                flex-direction: column;
                align-items: stretch;
            }
            
            .filter-group {
                width: 100%;
            }
            
            .export-btn {
                margin-left: 0;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Sales Dashboard</h1>
            <p>Eureka Club Tech Team - Real-time Sales Analytics</p>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label for="regionFilter">Region:</label>
                <select id="regionFilter">
                    <option value="">All Regions</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="productFilter">Product:</label>
                <select id="productFilter">
                    <option value="">All Products</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="startDate">Start Date:</label>
                <input type="date" id="startDate">
            </div>
            
            <div class="filter-group">
                <label for="endDate">End Date:</label>
                <input type="date" id="endDate">
            </div>
            
            <button class="export-btn" onclick="exportData()">📥 Export Data</button>
        </div>

        <div class="dashboard">
            <div class="loading" id="loading">Loading sales data...</div>
            
            <div class="metrics" id="metrics" style="display: none;">
                <div class="metric-card">
                    <div class="metric-value" id="totalRevenue">$0</div>
                    <div class="metric-label">Total Revenue</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="totalSales">0</div>
                    <div class="metric-label">Total Sales</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="avgOrderValue">$0</div>
                    <div class="metric-label">Avg Order Value</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="totalProducts">0</div>
                    <div class="metric-label">Products Sold</div>
                </div>
            </div>

            <div class="charts" id="charts" style="display: none;">
                <div class="chart-container">
                    <div class="chart-title">📈 Sales Trends Over Time</div>
                    <div class="chart-wrapper">
                        <canvas id="salesTrendChart"></canvas>
                    </div>
                </div>
                
                <div class="chart-container">
                    <div class="chart-title">🌍 Sales by Region</div>
                    <div class="chart-wrapper">
                        <canvas id="regionChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="top-products" id="topProducts" style="display: none;">
                <div class="chart-title">🏆 Top 5 Selling Products</div>
                <div class="products-list" id="productsList"></div>
            </div>
        </div>
    </div>

    <script>
        let allSalesData = [];
        let filteredData = [];
        let salesTrendChart = null;
        let regionChart = null;

        // API endpoint
        const API_URL = 'https://68d424b8214be68f8c6887f1.mockapi.io/api/eureka/tech/task/sales';

        // Load data when page loads
        document.addEventListener('DOMContentLoaded', loadSalesData);

        // Add event listeners for filters
        document.getElementById('regionFilter').addEventListener('change', applyFilters);
        document.getElementById('productFilter').addEventListener('change', applyFilters);
        document.getElementById('startDate').addEventListener('change', applyFilters);
        document.getElementById('endDate').addEventListener('change', applyFilters);

        async function loadSalesData() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Failed to fetch data');
                
                const rawData = await response.json();
                
                // Clean and standardize the data
                allSalesData = rawData.map(item => ({
                    sale_id: item.sale_id || item.id,
                    date: parseDate(item.date),
                    region: item.region || item.reigon || 'Unknown',
                    product: item.product,
                    quantity: parseInt(item.quantity) || 0,
                    unit_price: parseFloat(item.unit_price) || 0,
                    total_price: parseFloat(item.total_price) || 0
                })).filter(item => item.date && item.product && item.total_price > 0);

                filteredData = [...allSalesData];
                
                setupFilters();
                updateDashboard();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('metrics').style.display = 'grid';
                document.getElementById('charts').style.display = 'grid';
                document.getElementById('topProducts').style.display = 'block';
                
            } catch (error) {
                document.getElementById('loading').innerHTML = '<div class="error">❌ Error loading sales data. Please try again later.</div>';
                console.error('Error loading sales data:', error);
            }
        }

        function parseDate(dateValue) {
            if (!dateValue) return null;
            
            // Handle timestamp (like 1758952059)
            if (typeof dateValue === 'number' && dateValue > 1000000000) {
                return new Date(dateValue * 1000);
            }
            
            // Handle date string (like "2025-08-18")
            const date = new Date(dateValue);
            return isNaN(date.getTime()) ? null : date;
        }

        function setupFilters() {
            const regions = [...new Set(allSalesData.map(item => item.region))].sort();
            const products = [...new Set(allSalesData.map(item => item.product))].sort();
            
            populateSelect('regionFilter', regions);
            populateSelect('productFilter', products);
            
            // Set default date range
            const dates = allSalesData.map(item => item.date).filter(Boolean);
            if (dates.length > 0) {
                const minDate = new Date(Math.min(...dates));
                const maxDate = new Date(Math.max(...dates));
                
                document.getElementById('startDate').value = minDate.toISOString().split('T')[0];
                document.getElementById('endDate').value = maxDate.toISOString().split('T')[0];
            }
        }

        function populateSelect(selectId, options) {
            const select = document.getElementById(selectId);
            const currentValue = select.value;
            
            // Keep the "All" option and add new options
            const allOption = select.children[0];
            select.innerHTML = '';
            select.appendChild(allOption);
            
            options.forEach(option => {
                const optionElement = document.createElement('option');
                optionElement.value = option;
                optionElement.textContent = option;
                select.appendChild(optionElement);
            });
            
            select.value = currentValue;
        }

        function applyFilters() {
            const regionFilter = document.getElementById('regionFilter').value;
            const productFilter = document.getElementById('productFilter').value;
            const startDate = new Date(document.getElementById('startDate').value || '1970-01-01');
            const endDate = new Date(document.getElementById('endDate').value || '2099-12-31');

            filteredData = allSalesData.filter(item => {
                const matchesRegion = !regionFilter || item.region === regionFilter;
                const matchesProduct = !productFilter || item.product === productFilter;
                const matchesDate = item.date && item.date >= startDate && item.date <= endDate;
                
                return matchesRegion && matchesProduct && matchesDate;
            });

            updateDashboard();
        }

        function updateDashboard() {
            updateMetrics();
            updateSalesTrendChart();
            updateRegionChart();
            updateTopProducts();
        }

        function updateMetrics() {
            const totalRevenue = filteredData.reduce((sum, item) => sum + item.total_price, 0);
            const totalSales = filteredData.length;
            const avgOrderValue = totalSales > 0 ? totalRevenue / totalSales : 0;
            const totalProducts = filteredData.reduce((sum, item) => sum + item.quantity, 0);

            document.getElementById('totalRevenue').textContent = formatCurrency(totalRevenue);
            document.getElementById('totalSales').textContent = totalSales.toLocaleString();
            document.getElementById('avgOrderValue').textContent = formatCurrency(avgOrderValue);
            document.getElementById('totalProducts').textContent = totalProducts.toLocaleString();
        }

        function updateSalesTrendChart() {
            const ctx = document.getElementById('salesTrendChart').getContext('2d');
            
            // Group sales by month
            const salesByMonth = {};
            filteredData.forEach(item => {
                if (item.date) {
                    const monthKey = `${item.date.getFullYear()}-${String(item.date.getMonth() + 1).padStart(2, '0')}`;
                    salesByMonth[monthKey] = (salesByMonth[monthKey] || 0) + item.total_price;
                }
            });

            const sortedMonths = Object.keys(salesByMonth).sort();
            const labels = sortedMonths.map(month => {
                const [year, monthNum] = month.split('-');
                const date = new Date(year, monthNum - 1);
                return date.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
            });
            const data = sortedMonths.map(month => salesByMonth[month]);

            if (salesTrendChart) {
                salesTrendChart.destroy();
            }

            salesTrendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Sales Revenue',
                        data: data,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#667eea',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 2,
                        pointRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return '$' + value.toLocaleString();
                                }
                            }
                        }
                    }
                }
            });
        }

        function updateRegionChart() {
            const ctx = document.getElementById('regionChart').getContext('2d');
            
            // Group sales by region
            const salesByRegion = {};
            filteredData.forEach(item => {
                salesByRegion[item.region] = (salesByRegion[item.region] || 0) + item.total_price;
            });

            const regions = Object.keys(salesByRegion);
            const data = regions.map(region => salesByRegion[region]);
            const colors = [
                '#667eea', '#764ba2', '#f093fb', '#f5576c', 
                '#4ecdc4', '#45b7d1', '#96ceb4', '#ffecd2'
            ];

            if (regionChart) {
                regionChart.destroy();
            }

            regionChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: regions,
                    datasets: [{
                        data: data,
                        backgroundColor: colors.slice(0, regions.length),
                        borderWidth: 0,
                        hoverBorderWidth: 3,
                        hoverBorderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 20,
                                usePointStyle: true
                            }
                        }
                    }
                }
            });
        }

        function updateTopProducts() {
            // Group sales by product
            const salesByProduct = {};
            filteredData.forEach(item => {
                const key = item.product;
                if (!salesByProduct[key]) {
                    salesByProduct[key] = { revenue: 0, quantity: 0 };
                }
                salesByProduct[key].revenue += item.total_price;
                salesByProduct[key].quantity += item.quantity;
            });

            // Sort by revenue and get top 5
            const topProducts = Object.entries(salesByProduct)
                .sort((a, b) => b[1].revenue - a[1].revenue)
                .slice(0, 5);

            const productsList = document.getElementById('productsList');
            productsList.innerHTML = '';

            topProducts.forEach(([product, data], index) => {
                const productItem = document.createElement('div');
                productItem.className = 'product-item';
                productItem.innerHTML = `
                    <div>
                        <div class="product-name">#${index + 1} ${product}</div>
                        <div style="font-size: 0.9rem; color: #6c757d; margin-top: 5px;">
                            ${data.quantity} units sold
                        </div>
                    </div>
                    <div class="product-revenue">${formatCurrency(data.revenue)}</div>
                `;
                productsList.appendChild(productItem);
            });
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(amount);
        }

        function exportData() {
            const dataToExport = filteredData.map(item => ({
                'Sale ID': item.sale_id,
                'Date': item.date ? item.date.toISOString().split('T')[0] : '',
                'Region': item.region,
                'Product': item.product,
                'Quantity': item.quantity,
                'Unit Price': item.unit_price,
                'Total Price': item.total_price
            }));

            const csv = convertToCSV(dataToExport);
            downloadCSV(csv, 'sales_data.csv');
        }

        function convertToCSV(data) {
            if (!data.length) return '';
            
            const headers = Object.keys(data[0]);
            const csvContent = [
                headers.join(','),
                ...data.map(row => headers.map(header => {
                    const value = row[header];
                    // Escape commas and quotes in CSV
                    return typeof value === 'string' && value.includes(',') 
                        ? `"${value.replace(/"/g, '""')}"` 
                        : value;
                }).join(','))
            ].join('\n');
            
            return csvContent;
        }

        function downloadCSV(csv, filename) {
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
